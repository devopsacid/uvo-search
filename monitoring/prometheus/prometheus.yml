# Prometheus config for the local `monitoring` compose profile.
# Targets are compose service names on the default network. Nothing here is
# published to the host except Prometheus itself on 127.0.0.1:9090.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/uvo-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: uvo-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8001"]

  - job_name: uvo-mcp
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-server:8000"]

  # One job for all workers; `component` is derived from the target host name
  # (e.g. extractor-crz:8092 -> component="extractor-crz"). Dashboards and
  # alerts key on this label, so keep it identical in k8s.
  - job_name: uvo-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - extractor-vestnik:8091
          - extractor-crz:8092
          - extractor-ted:8093
          - extractor-itms:8094
          - ingestor:8095
          - dedup-worker:8096
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: component
        replacement: "$1"
