apiVersion: v1
kind: Service
metadata:
  name: gui-react
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: gui-react
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app.kubernetes.io/name: gui-react
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gui-react
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: gui-react
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gui-react
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gui-react
        app.kubernetes.io/part-of: uvo-search
    spec:
      terminationGracePeriodSeconds: 30
      # mirrors compose depends_on: api (healthy). NOTE: nginx.conf inside
      # the image hardcodes `proxy_pass http://api:8001` -- the in-cluster
      # Service MUST be named exactly "api" (it is) or the image must be
      # rebuilt with a different upstream name.
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z api 8001; do echo waiting for api; sleep 2; done"]
      containers:
        - name: gui-react
          image: REGISTRY_PLACEHOLDER/uvo-search-gui-react:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              # nginx.conf sets `pid /run/nginx.pid`; /var/run is a symlink to
              # /run in the nginx:alpine image, so the writable mount must
              # target /run directly or the pid write fails against the
              # read-only rootfs underneath the symlink.
              mountPath: /run
      volumes:
        - name: nginx-tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
