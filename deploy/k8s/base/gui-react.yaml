apiVersion: v1
kind: Service
metadata:
  name: gui-react
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: gui-react
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selector:
    app.kubernetes.io/name: gui-react
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gui-react
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: gui-react
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gui-react
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gui-react
        app.kubernetes.io/part-of: uvo-search
    spec:
      # mirrors compose depends_on: api (healthy). NOTE: nginx.conf inside
      # the image hardcodes `proxy_pass http://api:8001` -- the in-cluster
      # Service MUST be named exactly "api" (it is) or the image must be
      # rebuilt with a different upstream name.
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z api 8001; do echo waiting for api; sleep 2; done"]
      containers:
        - name: gui-react
          image: REGISTRY_PLACEHOLDER/uvo-search-gui-react:latest
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
