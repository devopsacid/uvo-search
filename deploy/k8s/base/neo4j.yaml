apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: neo4j
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neo4j
        app.kubernetes.io/part-of: uvo-search
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: neo4j
          image: neo4j:5
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          env:
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
            - name: NEO4J_server_memory_heap_initial__size
              value: "512m"
            - name: NEO4J_server_memory_heap_max__size
              value: "1g"
            - name: NEO4J_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: uvo-search-secrets
                  key: NEO4J_PASSWORD
          # NEO4J_AUTH must be a single "user/password" string; composed via
          # a shell-eval wrapper since k8s cannot concatenate secret values
          # directly in an env var. See command below.
          command:
            - "/bin/sh"
            - "-c"
            - |
              export NEO4J_AUTH="neo4j/${NEO4J_AUTH_USER}"
              exec /startup/docker-entrypoint.sh neo4j
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
            - name: neo4j-logs
              mountPath: /logs
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "1536Mi"
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: neo4j-logs
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
