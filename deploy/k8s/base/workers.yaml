apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: ingestor
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  # keep at 1 replica: consumer-group semantics on the Redis Stream are not
  # verified to be safe for concurrent consumers in this codebase.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestor
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: uvo-search
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do sleep 2; done"]
        - name: wait-for-mongo
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongo 27017; do sleep 2; done"]
        - name: wait-for-neo4j
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z neo4j 7687; do sleep 2; done"]
      containers:
        - name: ingestor
          image: REGISTRY_PLACEHOLDER/uvo-search-workers:latest
          args: ["uvo_workers.ingestor"]
          ports:
            - name: health
              containerPort: 8095
          envFrom:
            - configMapRef:
                name: uvo-search-config
            - secretRef:
                name: uvo-search-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8095
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
