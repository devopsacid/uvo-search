# 4 extractor workers + ingestor + dedup-worker. All consume/produce via
# Redis Streams and write to Mongo (ingestor also writes to Neo4j). None
# are called by other services directly, so no ClusterIP Service is
# created -- probes hit the pod's containerPort directly.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: extractor-vestnik
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: extractor-vestnik
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: extractor-vestnik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: extractor-vestnik
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: uvo-search
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do sleep 2; done"]
        - name: wait-for-mongo
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongo 27017; do sleep 2; done"]
      containers:
        - name: extractor-vestnik
          image: REGISTRY_PLACEHOLDER/uvo-search-workers:latest
          args: ["uvo_workers.vestnik"]
          ports:
            - name: health
              containerPort: 8091
          envFrom:
            - configMapRef:
                name: uvo-search-config
            - secretRef:
                name: uvo-search-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
---
