apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        app.kubernetes.io/part-of: uvo-search
    spec:
      # single-writer workload: force pod onto one node at a time when a
      # PVC is bound to an availability-zone-local hcloud volume
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongo
          # Pinned to 8.0 by digest (docker buildx imagetools inspect
          # mongodb/mongodb-atlas-local:8.0). Never use :latest -- it makes
          # rollback and drift detection meaningless.
          image: mongodb/mongodb-atlas-local:8.0@sha256:eff1e6306994d124c5461eb154001058b3c1268b3bb4fe6b9eaa5185231cb379
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGODB_INITDB_ROOT_USERNAME
              value: "uvo"
            - name: MONGODB_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uvo-search-secrets
                  key: MONGO_PASSWORD
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-configdb
              mountPath: /data/configdb
          # mongodb-atlas-local bundles mongod + mongot in one container;
          # readiness must wait for mongod to accept connections. mongot
          # (Atlas Search) itself can take longer to warm up after a cold
          # volume -- see deploy/README.md caveats.
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
    - metadata:
        name: mongo-configdb
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
