# Legacy one-shot backfill CLI (uvo_pipeline), replaces `docker compose run
# pipeline`. Excluded from base/kustomization.yaml's default resource list
# (a Job is not something you want ArgoCD auto-syncing/re-running on every
# diff) -- apply it manually as a one-off:
#
#   kubectl apply -f deploy/k8s/base/pipeline-job.yaml -n uvo-search
#   kubectl apply -f deploy/k8s/base/pipeline-job.yaml -n uvo-search \
#     --dry-run=client -o yaml | \
#     sed 's/PIPELINE_MODE_OVERRIDE/historical/' | kubectl apply -f -
#
# Or via kubectl create job --from=cronjob/... style one-off if you turn
# this into a CronJob later. Delete/recreate the Job object between runs
# since `metadata.name` is fixed and Jobs are immutable once created:
#
#   kubectl delete job uvo-pipeline-backfill -n uvo-search --ignore-not-found
#   kubectl apply -f deploy/k8s/base/pipeline-job.yaml -n uvo-search
apiVersion: batch/v1
kind: Job
metadata:
  name: uvo-pipeline-backfill
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: pipeline
    app.kubernetes.io/component: job
    app.kubernetes.io/part-of: uvo-search
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipeline
        app.kubernetes.io/component: job
        app.kubernetes.io/part-of: uvo-search
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongo 27017; do sleep 2; done"]
        - name: wait-for-neo4j
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z neo4j 7687; do sleep 2; done"]
      containers:
        - name: pipeline
          image: REGISTRY_PLACEHOLDER/uvo-search-pipeline:latest
          # override with ["--mode=historical"] for a full historical backfill
          args: ["--mode=recent"]
          envFrom:
            - configMapRef:
                name: uvo-search-config
            - secretRef:
                name: uvo-search-secrets
          volumeMounts:
            - name: pipeline-cache
              mountPath: /app/cache
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: pipeline-cache
          emptyDir:
            sizeLimit: 2Gi
