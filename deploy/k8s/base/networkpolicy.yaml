# Default deny-all ingress in the namespace; each policy below re-opens
# exactly one path. Egress is left unrestricted so workers can reach the
# upstream government APIs.
#
# Label key/values verified against the actual manifests
# (`grep app.kubernetes.io/name deploy/k8s/base/*.yaml`): every workload uses
# app.kubernetes.io/name, not the plan's assumed `app` key.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gui-react
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gui-and-ingress-to-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gui-react
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-datastore-access
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["mongo", "neo4j", "redis"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - api
                  - mcp-server
                  - ingestor
                  - dedup-worker
                  - extractor-vestnik
                  - extractor-crz
                  - extractor-ted
                  - extractor-itms
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
spec:
  # All 6 worker Deployments carry app.kubernetes.io/component: worker
  # (extractor-vestnik/crz/ted/itms, ingestor, dedup-worker) and are the only
  # workloads with prometheus.io/scrape annotations today (see workers.yaml)
  # -- api and mcp-server don't expose /metrics yet, so they're intentionally
  # not covered here. Add them to this selector if/when they gain a
  # prometheus.io/scrape annotation.
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # Namespace name is an assumption -- see the note in deploy/README.md
        # next to the ingress-nginx one. Adjust to match your Prometheus /
        # Alloy / Grafana Agent deployment's actual namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8091
        - protocol: TCP
          port: 8092
        - protocol: TCP
          port: 8093
        - protocol: TCP
          port: 8094
        - protocol: TCP
          port: 8095
        - protocol: TCP
          port: 8096
