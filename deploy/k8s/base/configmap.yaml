apiVersion: v1
kind: ConfigMap
metadata:
  name: uvo-search-config
  namespace: uvo-search
  labels:
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  # -- Data sources
  EKOSYSTEM_BASE_URL: "https://datahub.ekosystem.slovensko.digital"

  # -- Networking (in-cluster, service-name DNS — never localhost)
  MCP_SERVER_URL: "http://mcp-server:8000/mcp"
  MCP_HOST: "0.0.0.0"
  MCP_PORT: "8000"
  API_MCP_SERVER_URL: "http://mcp-server:8000/mcp"
  API_PORT: "8001"

  # -- API / Mongo (non-secret parts; credentials live in the Secret)
  API_MONGODB_DATABASE: "uvo_search"

  # -- Caching
  CACHE_TTL_SEARCH: "300"
  CACHE_TTL_ENTITY: "3600"
  CACHE_TTL_DETAIL: "1800"

  # -- General
  REQUEST_TIMEOUT: "30.0"
  LOG_LEVEL: "INFO"

  # -- Neo4j (non-secret)
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"

  # -- Pipeline behaviour (legacy one-shot Job — see deploy/k8s/base/jobs/)
  PIPELINE_MODE: "recent"
  RECENT_DAYS: "365"
  HISTORICAL_FROM_YEAR: "2014"

  # -- Redis (non-secret URL; auth via REDIS_PASSWORD secret if enabled)
  REDIS_URL: "redis://redis:6379/0"

  # -- Per-source extractor cadence (seconds)
  VESTNIK_INTERVAL_SECONDS: "3600"
  CRZ_INTERVAL_SECONDS: "3600"
  TED_INTERVAL_SECONDS: "21600"
  ITMS_INTERVAL_SECONDS: "3600"

  # -- Per-source extraction mode
  VESTNIK_MODE: "recent"
  CRZ_MODE: "recent"
  TED_MODE: "recent"
  ITMS_MODE: "recent"

  # -- Cross-source dedup worker
  DEDUP_INTERVAL_SECONDS: "3600"
  DEDUP_DEBOUNCE_SECONDS: "5"
  DEDUP_WINDOW_DAYS: "30"

  # -- ITMS cache
  ITMS_CACHE_BACKEND: "redis"
  ITMS_CACHE_TTL_SECONDS: "604800"

  # -- Ingestor consumer
  INGESTOR_BATCH_SIZE: "100"
  STREAM_MAXLEN_APPROX: "100000"
