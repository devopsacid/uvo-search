# SECRET TEMPLATE -- DO NOT APPLY AS-IS AND DO NOT COMMIT REAL VALUES.
#
# This file documents the exact keys the workload expects (mirrors .env.example).
# All values below are inert placeholders. For a real GitOps rollout, replace this
# object with output from sealed-secrets (kubeseal) or an ExternalSecret resource
# (external-secrets-operator pulling from Hetzner-compatible Vault/1Password/etc).
# See deploy/README.md "Secret bootstrapping" for the recommended workflow.
#
# It is intentionally excluded from base/kustomization.yaml's resources list so
# `kubectl apply -k` / ArgoCD never applies it directly. Rendered/sealed secrets
# should be added per-overlay instead (see overlays/hetzner).
apiVersion: v1
kind: Secret
metadata:
  name: uvo-search-secrets
  namespace: uvo-search
  labels:
    app.kubernetes.io/part-of: uvo-search
type: Opaque
stringData:
  # -- MongoDB Atlas Local root credentials + full connection URIs
  MONGO_PASSWORD: "CHANGEME"
  MONGODB_URI: "mongodb://uvo:CHANGEME@mongo:27017"
  API_MONGODB_URI: "mongodb://uvo:CHANGEME@mongo:27017"

  # -- Neo4j
  NEO4J_PASSWORD: "CHANGEME"

  # -- Redis AUTH (REQUIRED — the server sets --requirepass from this value)
  REDIS_PASSWORD: "CHANGEME"

  # -- Optional external API token
  EKOSYSTEM_API_TOKEN: ""
