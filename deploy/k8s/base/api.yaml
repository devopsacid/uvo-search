apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: uvo-search
    spec:
      # mirrors compose depends_on: mcp-server (healthy)
      initContainers:
        - name: wait-for-mcp-server
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mcp-server 8000; do echo waiting for mcp-server; sleep 2; done"]
      containers:
        - name: api
          image: REGISTRY_PLACEHOLDER/uvo-search-api:latest
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: uvo-search-config
            - secretRef:
                name: uvo-search-secrets
          env:
            # compose sets this explicitly (overrides .env value) -- kept
            # identical here for parity; already in the ConfigMap too.
            - name: API_MCP_SERVER_URL
              value: "http://mcp-server:8000/mcp"
            # ApiSettings reads env_prefix "API_", so the unprefixed
            # REDIS_PASSWORD delivered by envFrom is invisible to it. Map the
            # same Secret key across rather than duplicating the value, or the
            # /v1 rate limiter gets NOAUTH and fails closed on every request.
            - name: API_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uvo-search-secrets
                  key: REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
