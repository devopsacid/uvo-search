apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app.kubernetes.io/name: mcp-server
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: uvo-search
  labels:
    app.kubernetes.io/name: mcp-server
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
        app.kubernetes.io/part-of: uvo-search
    spec:
      # mirrors compose depends_on: mongo (healthy), neo4j (healthy)
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mongo 27017; do echo waiting for mongo; sleep 2; done"]
        - name: wait-for-neo4j
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z neo4j 7687; do echo waiting for neo4j; sleep 2; done"]
      containers:
        - name: mcp-server
          image: REGISTRY_PLACEHOLDER/uvo-search-mcp:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: uvo-search-config
            - secretRef:
                name: uvo-search-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
