# PLACEHOLDER ONLY -- inert values, safe to commit, NOT safe to `kubectl apply`
# to a real cluster expecting real data. This exists purely so that
# `kubectl kustomize overlays/hetzner` renders a complete, self-consistent
# manifest set for local validation and for the ArgoCD Application to sync
# against as a documented starting point.
#
# Before a real GitOps rollout, replace this file with the output of
# `kubeseal` (sealed-secrets) or an `ExternalSecret` (external-secrets
# operator) that resolves the same "uvo-search-secrets" object from your
# actual secret store. See deploy/README.md "Secret bootstrapping".
apiVersion: v1
kind: Secret
metadata:
  name: uvo-search-secrets
  labels:
    app.kubernetes.io/part-of: uvo-search
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  MONGO_PASSWORD: "CHANGEME"
  MONGODB_URI: "mongodb://uvo:CHANGEME@mongo:27017"
  API_MONGODB_URI: "mongodb://uvo:CHANGEME@mongo:27017"
  NEO4J_PASSWORD: "CHANGEME"
  # Redis AUTH is mandatory — the server reads --requirepass from this value,
  # so an empty string would start an unauthenticated Redis.
  REDIS_PASSWORD: "CHANGEME"
  # Bearer token for the operational dashboard endpoints. Deliberately EMPTY:
  # require_ops_token fails closed with 503 when unset, whereas a literal
  # "CHANGEME" would be a working, guessable token if this placeholder ever got
  # synced without being replaced by kubeseal/ExternalSecret.
  API_OPS_TOKEN: ""
  EKOSYSTEM_API_TOKEN: ""
