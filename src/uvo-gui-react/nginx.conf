server {
    # Unprivileged port: k8s runs this container as non-root (uid 10001) with
    # all capabilities dropped (see deploy/k8s/base/gui-react.yaml), so nginx
    # cannot bind <1024. The in-cluster Service still exposes port 80 and
    # forwards to this containerPort (see gui-react.yaml Service targetPort).
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $upstream http://api:8001;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames under /assets/, so they never change.
    # A missing hashed file must 404 (not fall back to index.html), otherwise a
    # stale client would receive HTML where it expects JS.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry document (and SPA fallback) must always revalidate so a deploy
    # is picked up immediately and points at the new hashed assets.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
