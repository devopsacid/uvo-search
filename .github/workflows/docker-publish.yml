name: Publish Docker Images

# Publishes every application image, but only for a commit on main whose CI
# run (unit tests, lint, frontend, image build + import checks, E2E) succeeded.
# It is triggered by that CI run completing, not by the push itself, so a red
# main never produces tags.
#
# Tags (unchanged, consumed downstream -- do not rename):
#   ghcr.io/<repo>/uvo-{mcp,api,workers,gui,pipeline}:sha-<7-char commit sha>
#   ghcr.io/<repo>/uvo-{mcp,api,workers,gui,pipeline}:latest
#
# Production runs on the Hetzner k8s cluster managed from the stubarag-infra
# repo (argocd/manifests/uvo-search), which pins the `sha-<short>` tag.
# Publishing does NOT deploy; bumping the pin in stubarag-infra does.
# deploy/k8s in this repo is superseded and not used for deployment.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io

# One publish at a time, in order; never cancel one mid-push (that could leave
# `latest` and `sha-*` pointing at different builds).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push (${{ matrix.image }})
    # workflow_run fires for every CI completion, including PR runs from
    # forks/branches named main and failed/cancelled runs.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mcp
            dockerfile: Dockerfile
            target: mcp
            context: .
          - image: api
            dockerfile: Dockerfile
            target: api
            context: .
          - image: workers
            dockerfile: Dockerfile
            target: workers
            context: .
          - image: gui
            dockerfile: src/uvo-gui-react/Dockerfile
            target: ""
            context: src/uvo-gui-react
          # Legacy one-shot backfill CLI (deploy/k8s/base/pipeline-job.yaml
          # runs it as a manual batch/v1 Job, never a Deployment). Not
          # long-lived, but a real runnable artifact that ci.yml builds and
          # import-checks, so keep it published.
          - image: pipeline
            dockerfile: Dockerfile
            target: pipeline
            context: .

    steps:
      # Build exactly the commit CI validated, not whatever main moved to since.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute short sha
        id: sha
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # type=sha would use github.sha, which on a workflow_run event is the
      # default branch tip, not the validated commit -- so tag explicitly.
      - name: Extract metadata for ${{ matrix.image }} image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/uvo-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.sha.outputs.short }}

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
