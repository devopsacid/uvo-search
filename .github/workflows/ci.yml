name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (with dev extras)
        run: uv sync --frozen --extra dev

      - name: Run pytest (unit tests only)
        run: uv run pytest tests/ -v --tb=short -m "not e2e and not integration"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (with dev extras)
        run: uv sync --frozen --extra dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  images:
    name: Build Docker images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile.mcp, Dockerfile.api, Dockerfile.workers, Dockerfile.pipeline]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.dockerfile }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

  manifests:
    name: Validate k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Render and validate manifests
        run: |
          kubectl kustomize deploy/k8s/overlays/hetzner > /tmp/rendered.yaml
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml

      - name: Fail if any application image is unpinned
        run: |
          if grep -E 'image:.*:(latest)$' /tmp/rendered.yaml; then
            echo "::error::Unpinned :latest image found in rendered manifests"
            exit 1
          fi

  docker-compose:
    name: Docker Compose Build & E2E
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for docker compose
        run: |
          : > .env

      - name: Build and start services
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Verify MCP server health
        run: |
          curl -sf http://localhost:8000/health | jq .
          echo "MCP server healthy"

      - name: Verify React GUI is serving
        run: |
          curl -sf http://localhost:8080/ -o /dev/null -w "%{http_code}"
          echo ""
          echo "React GUI is serving"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install test dependencies
        run: uv sync --frozen --extra dev

      - name: Run E2E tests
        run: uv run pytest tests/e2e/ -v --tb=short -m e2e

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
