name: CI

# push is limited to main; every other branch is covered by its pull_request
# run. Triggering on both for a PR branch ran the whole pipeline twice.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: it would swallow that commit's publish (and its
  # sha-<short> tag, which prod pins). PR runs are safe to supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (with dev extras)
        run: uv sync --frozen --extra dev

      - name: Run pytest (unit tests only)
        run: uv run pytest tests/ -v --tb=short -m "not e2e and not integration"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (with dev extras)
        run: uv sync --frozen --extra dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/uvo-gui-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/uvo-gui-react/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The `lint` script needs an ESLint flat config. Skip (loudly) until one
      # exists rather than failing every PR on a missing file.
      - name: Lint
        run: |
          if ls eslint.config.* >/dev/null 2>&1; then
            npm run lint
          else
            echo "::warning::No eslint.config.* in src/uvo-gui-react; skipping lint"
          fi

      - name: Type check
        run: npx tsc -b

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  images:
    name: Build image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mcp
            context: .
            file: Dockerfile
            target: mcp
            mods: "uvo_mcp uvo_core"
          - image: api
            context: .
            file: Dockerfile
            target: api
            mods: "uvo_api uvo_core uvo_pipeline"
          - image: workers
            context: .
            file: Dockerfile
            target: workers
            mods: "uvo_workers uvo_core uvo_pipeline"
          # uvo_pipeline does not import uvo_mcp, and the image no longer ships it.
          - image: pipeline
            context: .
            file: Dockerfile
            target: pipeline
            mods: "uvo_pipeline uvo_core"
          - image: gui
            context: src/uvo-gui-react
            file: src/uvo-gui-react/Dockerfile
            target: ""
            mods: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache scope == image name, shared with docker-publish.yml so the publish
      # run after a green main build is a cache hit.
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: uvo-ci:${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # A build that succeeds proves nothing about whether the app can start.
      # An image whose first-party packages never landed in the venv builds
      # perfectly and then dies with ModuleNotFoundError at runtime, which is
      # exactly what shipped once already. Import them here, read-only like
      # the k8s securityContext.
      - name: Verify first-party packages are importable
        if: matrix.mods != ''
        run: |
          for m in ${{ matrix.mods }}; do
            docker run --rm --read-only --entrypoint /app/.venv/bin/python \
              uvo-ci:${{ matrix.image }} -c "import $m"
            echo "  ok: $m"
          done

      - name: Verify nginx config is valid and serves index.html
        if: matrix.image == 'gui'
        run: |
          docker run --rm uvo-ci:gui nginx -t
          docker run -d --name gui-check -p 18080:8080 uvo-ci:gui
          for i in $(seq 1 15); do
            curl -sf http://localhost:18080/ -o /tmp/index.html && break
            sleep 1
          done
          grep -qi "<!doctype html" /tmp/index.html
          docker rm -f gui-check

  manifests:
    name: Validate k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Render and validate manifests
        run: |
          kubectl kustomize deploy/k8s/overlays/hetzner > /tmp/rendered.yaml
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml

      - name: Fail if any application image is unpinned
        run: |
          if grep -E 'image:.*:(latest)$' /tmp/rendered.yaml; then
            echo "::error::Unpinned :latest image found in rendered manifests"
            exit 1
          fi

  docker-compose:
    name: Docker Compose Build & E2E
    runs-on: ubuntu-latest
    needs: [test, lint, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env file for docker compose
        run: |
          # Throwaway credentials for this ephemeral runner only. An empty .env
          # no longer works: docker-compose.yml uses ${VAR:?} for every
          # credential so a misconfigured deploy fails loudly instead of
          # silently starting with a known-weak password.
          MONGO_PASSWORD=$(openssl rand -hex 16)
          {
            echo "MONGO_PASSWORD=${MONGO_PASSWORD}"
            echo "NEO4J_PASSWORD=$(openssl rand -hex 16)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 16)"
            # PipelineSettings/ApiSettings require these outright — Phase 1
            # removed their weak defaults, so an omission is a startup crash,
            # not a fallback. Hosts are compose service names, never localhost.
            echo "MONGODB_URI=mongodb://uvo:${MONGO_PASSWORD}@mongo:27017"
            echo "API_MONGODB_URI=mongodb://uvo:${MONGO_PASSWORD}@mongo:27017"
          } > .env

      - name: Build and start services
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Verify MCP server health
        run: |
          curl -sf http://localhost:8000/health | jq .
          echo "MCP server healthy"

      - name: Verify React GUI is serving
        run: |
          curl -sf http://localhost:8080/ -o /dev/null -w "%{http_code}"
          echo ""
          echo "React GUI is serving"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install test dependencies
        run: uv sync --frozen --extra dev

      - name: Run E2E tests
        run: uv run pytest tests/e2e/ -v --tb=short -m e2e

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v
